security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        app_users:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        api:
            pattern: ^/api
            lazy: true
            provider: app_users
            stateless: false
            custom_authenticators:
                - App\Infrastructure\Security\SessionAuthenticator
            entry_point: App\Infrastructure\Security\SessionAuthenticator
            access_denied_handler: App\Presentation\Security\JsonAccessDenied

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
